<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jomua</title>
<meta name="description" content="jomua is coming soon.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e4572e'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #faf7f2;
    --fg: #1d1b19;
    --muted: #6b655e;
    --accent: #e4572e;
    --line: #e3ddd3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413;
      --fg: #f3efe9;
      --muted: #a39c93;
      --accent: #ff7a50;
      --line: #2c2a27;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: grid;
    grid-template-rows: 1fr auto;
    -webkit-font-smoothing: antialiased;
  }
  main {
    display: grid;
    place-content: center;
    justify-items: start;
    gap: 1.25rem;
    padding: 2rem 1.5rem;
    max-width: 40rem;
    width: 100%;
    margin: 0 auto;
  }
  .mark {
    display: flex;
    align-items: baseline;
    gap: 0.35rem;
    font-size: clamp(3.5rem, 14vw, 7rem);
    font-weight: 700;
    letter-spacing: -0.05em;
    line-height: 0.9;
    margin: 0;
  }
  .mark span {
    width: 0.16em;
    height: 0.16em;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }
  p {
    margin: 0;
    font-size: clamp(1.05rem, 2.6vw, 1.3rem);
    line-height: 1.5;
    color: var(--muted);
    max-width: 28rem;
  }
  a.contact {
    display: inline-block;
    margin-top: 0.5rem;
    padding: 0.7rem 1.1rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--fg);
    text-decoration: none;
    font-weight: 500;
    transition: border-color 0.15s, color 0.15s;
  }
  a.contact:hover, a.contact:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
    outline: none;
  }
  footer {
    padding: 1.25rem 1.5rem;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
  }
</style>
</head>
<body>
  <main>
    <h1 class="mark">jomua<span aria-hidden="true"></span></h1>
    <p>Something new is on its way. Coming soon.</p>
    <a class="contact" id="contact" href="#">Get in touch</a>
    <noscript><p>hello [at] jomua [dot] com</p></noscript>
  </main>
  <footer>&copy; 2026 jomua</footer>
  <script>
    // Address is assembled here so it does not sit in the HTML for scrapers.
    (function () {
      var a = ['hello', 'jomua.com'].join('@');
      var el = document.getElementById('contact');
      el.textContent = a;
      el.href = 'mai' + 'lto:' + a;
    })();
  </script>
</body>
</html>
